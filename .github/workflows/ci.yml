name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[mcp,pdf]"
      - name: Offline tests
        run: pytest -m "not live"
      - name: Ruff
        run: pip install ruff && ruff check openclaw_fetch tests || true
      - name: Mypy
        run: pip install mypy && mypy openclaw_fetch --ignore-missing-imports || true
