[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-fetch"
version = "0.3.0"
description = "Multi-network (Normal/Tor/I2P) fetcher toolkit for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "OpenClaw Darknet Fetch contributors" }]
keywords = ["tor", "i2p", "onion", "fetch", "agent", "openclaw", "mcp"]
dependencies = [
    "requests[socks]>=2.31",
]

[project.optional-dependencies]
pdf = ["pypdf"]
mcp = ["mcp"]
all = ["pypdf", "mcp"]

[project.scripts]
openclaw-fetch = "openclaw_fetch.cli:main"

[tool.setuptools.packages.find]
include = ["openclaw_fetch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not live\""
markers = [
    "live: needs real network/proxies (Tor, I2P, clearnet); run with `-m live`",
]